spring:
  jpa:
    generate-ddl: off
  datasource:
    url: jdbc:postgresql://localhost/auth_db
    username: postgres
    password: postgres
    hikari:
      schema: auth_schema
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
    liquibaseSchema: auth_schema
  application:
    name: mc-auth
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8081

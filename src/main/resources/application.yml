spring:
  jpa:
    generate-ddl: off
  datasource:
    url: jdbc:postgresql://${HOST:localhost}/auth_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      schema: ${POSTGRES_SCHEMA:auth_schema}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
    liquibaseSchema: auth_schema
  application:
    name: mc-auth
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8081
eureka:
  client:
    register-with-eureka: true

    service-url:
      defaultZone: http://${EUREKA-HOST:localhost}:8761/eureka/
    fetch-registry: true
  instance:
    hostname: ${mc-auth:localhost}
    prefer-ip-address: true
#    instance-id: ${spring.application.name}:${random.uuid}

app:
  kafka:
    enable: true
    userRegistration: "REGISTER_TOP"
    roomReservation: "ACCOUNT_CHANGES"
    kafkaMessageGroupId: "NOTIFICATION"
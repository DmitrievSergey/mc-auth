spring:
  jpa:
    generate-ddl: off
  datasource:
    url: jdbc:postgresql://localhost/auth_db
    username: postgres
    password: postgres
    hikari:
      schema: auth_schema
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
    liquibaseSchema: auth_schema

server:
  port: 8081
